<ion-header [translucent]="true">
  <ion-toolbar>
    <!-- Displays the movie title as the page name -->
    <ion-title>{{movie.title}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Ion-card which displays the movie description and the add to favourites button -->
  <ion-card>
    <ion-card-content>
      <p>{{movie.overview}}</p>
      <br>
      <ion-button [fill]="buttonFill" (click)="toggleFavourite()">{{buttonText}}
        <ion-icon slot="start" name="heart"></ion-icon>
      </ion-button>
    </ion-card-content>
  </ion-card>
  
  <h3>Cast:</h3>

  <!-- ngFor displays an ion-card for each cast member -->
  <ion-card *ngFor="let c of cast" button (click)="clickPerson(c)">

    <!-- This displays the cast member image if profile_path exists. Without *ngIf it can show broken img links -->
    <img *ngIf="c.profile_path" [src]="'https://image.tmdb.org/t/p/w300' + c.profile_path">

    <!-- If profile_path does not exist. Show 'no image' -->
    <p *ngIf="!c.profile_path">No Image</p>

    <!-- Shows character name and actor name -->
    <h3>{{c.character}}</h3>
    <p>{{c.name}}</p>
  </ion-card>
</ion-content>
