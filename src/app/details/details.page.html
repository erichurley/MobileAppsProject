<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{personDetails.name}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <!-- This displays the persons image if profile_path exists. Without *ngIf it can show broken img links -->
    <img *ngIf="personDetails.profile_path" [src]="'https://image.tmdb.org/t/p/w300' + personDetails.profile_path">

    <!-- Displays their alternate name -->
    <h3>{{personDetails.also_known_as}}</h3>

    <!-- Displays their DOB -->
    <h5>{{personDetails.birthday}}</h5>

    <!-- Displays their place of birth -->
    <h5>{{personDetails.place_of_birth}}</h5>

    <!-- Displays their biography -->
    <p>{{personDetails.biography}}</p>


  </ion-card>



  <ion-button [routerLink]="['/home']">Go to homepage</ion-button>
  <ion-button [routerLink]="['/movie-details']">Go to movie details page</ion-button>
  <ion-button [routerLink]="['/details']">Go to details page</ion-button>
  <ion-button [routerLink]="['/favourites']">Go to favourites page</ion-button>
</ion-content>
